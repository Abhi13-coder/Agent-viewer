name: Build AndroidTk APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools, platform-tools
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore AndroidTk/app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle busybox for both 32-bit and 64-bit devices
        run: |
          mkdir -p AndroidTk/app/src/main/jniLibs/armeabi-v7a
          mkdir -p AndroidTk/app/src/main/jniLibs/arm64-v8a
          curl -L -o AndroidTk/app/src/main/jniLibs/armeabi-v7a/libbusybox.so \
            https://github.com/xerta555/Busybox-Binaries/raw/refs/heads/master/busybox-arm
          curl -L -o AndroidTk/app/src/main/jniLibs/arm64-v8a/libbusybox.so \
            https://github.com/xerta555/Busybox-Binaries/raw/refs/heads/master/busybox-arm64

      - name: Bundle proot and its real dependencies (libtalloc, libandroid-shmem)
        run: |
          for arch in arm aarch64; do
            curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-${arch}/Packages.gz" -o /tmp/Packages-${arch}.gz
            gunzip -f /tmp/Packages-${arch}.gz
          done

          get_filename() {
            local pkg=$1 arch=$2
            awk -v pkg="$pkg" '
              /^Package: /{p=$2; f=""}
              /^Filename: /{f=$2}
              p==pkg && f!="" {print f; exit}
            ' /tmp/Packages-${arch} | tr -d '\r\n'
          }

          for arch in arm aarch64; do
            for pkg in proot libtalloc libandroid-shmem; do
              FILENAME=$(get_filename "$pkg" "$arch")
              echo "$pkg ($arch) -> $FILENAME"
              curl -L -o /tmp/${pkg}-${arch}.deb "https://packages-cf.termux.dev/apt/termux-main/${FILENAME}"
              dpkg-deb -x /tmp/${pkg}-${arch}.deb /tmp/${pkg}-${arch}-extract
            done
          done

          cp /tmp/proot-arm-extract/data/data/com.termux/files/usr/bin/proot \
            AndroidTk/app/src/main/jniLibs/armeabi-v7a/libproot.so
          cp /tmp/proot-aarch64-extract/data/data/com.termux/files/usr/bin/proot \
            AndroidTk/app/src/main/jniLibs/arm64-v8a/libproot.so

          find /tmp/libtalloc-arm-extract -name "libtalloc.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/armeabi-v7a/libtalloc.so \;
          find /tmp/libtalloc-aarch64-extract -name "libtalloc.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/arm64-v8a/libtalloc.so \;

          find /tmp/libandroid-shmem-arm-extract -name "libandroid-shmem.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/armeabi-v7a/libandroid-shmem.so \;
          find /tmp/libandroid-shmem-aarch64-extract -name "libandroid-shmem.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so \;

      - name: Fetch curl + its real dependency chain, and ca-certificates, from Termux's own repo
        run: |
          set +e
          mkdir -p /tmp/termux-curl/arm /tmp/termux-curl/aarch64
          mkdir -p AndroidTk/app/src/main/jniLibs/armeabi-v7a AndroidTk/app/src/main/jniLibs/arm64-v8a
          mkdir -p AndroidTk/app/src/main/assets

          fetch_for_arch() {
            local termux_arch="$1" jni_abi="$2"
            local workdir="/tmp/termux-curl/$termux_arch"
            local base="https://packages-cf.termux.dev/apt/termux-main"

            echo ">>> [$termux_arch] fetching index"
            curl -fsSL -o "$workdir/Packages.gz" \
              "$base/dists/stable/main/binary-$termux_arch/Packages.gz" || { echo "!!! index download FAILED for $termux_arch"; return 1; }
            gunzip -f "$workdir/Packages.gz" || { echo "!!! gunzip FAILED for $termux_arch"; return 1; }
            echo ">>> [$termux_arch] index ok, $(wc -l < "$workdir/Packages") lines"

            find_pkg() {
              awk -v want="$1" '
                BEGIN { RS=""; FS="\n" }
                {
                  name=""; fname=""; deps=""
                  for (i=1; i<=NF; i++) {
                    if ($i ~ /^Package: /) name=substr($i,10)
                    else if ($i ~ /^Filename: /) fname=substr($i,11)
                    else if ($i ~ /^Depends: /) deps=substr($i,10)
                  }
                  if (name == want) { print name "\t" fname "\t" deps; exit }
                }' "$workdir/Packages"
            }

            declare -A seen
            queue=("curl" "ca-certificates")
            while [ ${#queue[@]} -gt 0 ]; do
              pkg="${queue[0]}"; queue=("${queue[@]:1}")
              [ -n "${seen[$pkg]}" ] && continue
              seen[$pkg]=1

              echo ">>> [$termux_arch] resolving $pkg"
              row=$(find_pkg "$pkg")
              if [ -z "$row" ]; then echo "!!! [$termux_arch] $pkg NOT FOUND in index, skipping"; continue; fi

              fname=$(echo "$row" | cut -f2)
              deps=$(echo "$row" | cut -f3 | tr ',' '\n' | sed 's/|.*//' | sed 's/(.*//' | sed 's/^ *//;s/ *$//' | grep -v '^$')
              echo ">>> [$termux_arch] $pkg -> $fname (deps: $deps)"

              debfile="$workdir/$(basename "$fname")"
              if ! curl -fsSL -o "$debfile" "$base/$fname"; then
                echo "!!! [$termux_arch] download FAILED for $pkg ($fname), skipping"
                continue
              fi

              extractdir="$workdir/extract-$pkg"
              mkdir -p "$extractdir"
              if ! ( cd "$extractdir" && ar -x "$debfile" ); then
                echo "!!! [$termux_arch] ar extract FAILED for $pkg, skipping"
                continue
              fi

              datatar=$(ls "$extractdir"/data.tar.* 2>/dev/null | head -n1)
              if [ -z "$datatar" ]; then
                echo "!!! [$termux_arch] no data.tar.* found for $pkg, skipping"
                continue
              fi

              datadir="$extractdir/data"; mkdir -p "$datadir"
              case "$datatar" in
                *.xz) tar -xJf "$datatar" -C "$datadir" || echo "!!! tar -xJf failed for $pkg" ;;
                *.gz) tar -xzf "$datatar" -C "$datadir" || echo "!!! tar -xzf failed for $pkg" ;;
                *.zst) echo "!!! [$termux_arch] $pkg uses zstd, unsupported, skipping"; continue ;;
                *)    tar -xf  "$datatar" -C "$datadir" || echo "!!! tar -xf failed for $pkg" ;;
              esac

              for dep in $deps; do queue+=("$dep"); done
            done

            echo ">>> [$termux_arch] flattening into jniLibs/$jni_abi"
            find "$workdir" -path "*/data/*" -type f 2>/dev/null | while read -r f; do
              case "$f" in
                *.so|*.so.*)
                  cp -f "$f" "AndroidTk/app/src/main/jniLibs/$jni_abi/$(basename "$f")"
                  ;;
                */bin/curl)
                  cp -f "$f" "AndroidTk/app/src/main/jniLibs/$jni_abi/libcurl_bin.so"
                  ;;
              esac
            done
          }

          fetch_for_arch "arm" "armeabi-v7a"
          fetch_for_arch "aarch64" "arm64-v8a"

          CERT_FILE=$(find /tmp/termux-curl -iname "cert.pem" -o -iname "cacert.pem" | head -n1)
          if [ -n "$CERT_FILE" ]; then
            cp -f "$CERT_FILE" AndroidTk/app/src/main/assets/cacert.pem
            echo ">>> ca-certificates bundle placed at assets/cacert.pem ($(wc -c < "$CERT_FILE") bytes)"
          else
            echo "!!! no cert.pem/cacert.pem found anywhere under /tmp/termux-curl — HTTPS via curl will fail without this"
          fi

          chmod +x AndroidTk/app/src/main/jniLibs/armeabi-v7a/* AndroidTk/app/src/main/jniLibs/arm64-v8a/* 2>/dev/null || true
          echo "=== armeabi-v7a (this is the ONLY listing that matters — confirm libcurl_bin.so is really here) ==="
          ls -la AndroidTk/app/src/main/jniLibs/armeabi-v7a/
          echo "=== arm64-v8a ==="
          ls -la AndroidTk/app/src/main/jniLibs/arm64-v8a/
          echo "=== assets ==="
          ls -la AndroidTk/app/src/main/assets/

      - name: Build debug APK
        working-directory: AndroidTk
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidtk-debug
          path: AndroidTk/app/build/outputs/apk/debug/*.apk

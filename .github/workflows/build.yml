name: Build AndroidTk APK

on:
 workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools, platform-tools
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore AndroidTk/app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle busybox for both 32-bit and 64-bit devices
        run: |
          mkdir -p AndroidTk/app/src/main/jniLibs/armeabi-v7a
          mkdir -p AndroidTk/app/src/main/jniLibs/arm64-v8a
          curl -L -o AndroidTk/app/src/main/jniLibs/armeabi-v7a/libbusybox.so \
            https://github.com/xerta555/Busybox-Binaries/raw/refs/heads/master/busybox-arm
          curl -L -o AndroidTk/app/src/main/jniLibs/arm64-v8a/libbusybox.so \
            https://github.com/xerta555/Busybox-Binaries/raw/refs/heads/master/busybox-arm64

      - name: Bundle proot for both 32-bit and 64-bit devices
        run: |
          curl -L -o /tmp/proot-arm.deb \
            https://plug-mirror.rcac.purdue.edu/termux/apt/termux-main/pool/main/p/proot/proot_5.1.107-65_arm.deb
          curl -L -o /tmp/proot-aarch64.deb \
            https://plug-mirror.rcac.purdue.edu/termux/apt/termux-main/pool/main/p/proot/proot_5.1.107-65_aarch64.deb
          dpkg-deb -x /tmp/proot-arm.deb /tmp/proot-arm-extract
          dpkg-deb -x /tmp/proot-aarch64.deb /tmp/proot-aarch64-extract
          cp /tmp/proot-arm-extract/data/data/com.termux/files/usr/bin/proot \
            AndroidTk/app/src/main/jniLibs/armeabi-v7a/libproot.so
          cp /tmp/proot-aarch64-extract/data/data/com.termux/files/usr/bin/proot \
            AndroidTk/app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Build debug APK
        working-directory: AndroidTk
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidtk-debug
          path: AndroidTk/app/build/outputs/apk/debug/*.apk

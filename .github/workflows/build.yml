name: Build AndroidTk APK

on:
 workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools, platform-tools
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore AndroidTk/app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle busybox for both 32-bit and 64-bit devices
        run: |
          mkdir -p AndroidTk/app/src/main/jniLibs/armeabi-v7a
          mkdir -p AndroidTk/app/src/main/jniLibs/arm64-v8a
          curl -L -o AndroidTk/app/src/main/jniLibs/armeabi-v7a/libbusybox.so \
            https://github.com/xerta555/Busybox-Binaries/raw/refs/heads/master/busybox-arm
          curl -L -o AndroidTk/app/src/main/jniLibs/arm64-v8a/libbusybox.so \
            https://github.com/xerta555/Busybox-Binaries/raw/refs/heads/master/busybox-arm64

      - name: Bundle proot and its real dependencies (libtalloc, libandroid-shmem)
        run: |
          for arch in arm aarch64; do
            curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-${arch}/Packages.gz" -o /tmp/Packages-${arch}.gz
            gunzip -f /tmp/Packages-${arch}.gz
          done

          get_filename() {
            local pkg=$1 arch=$2
            awk -v pkg="$pkg" '
              /^Package: /{p=$2; f=""}
              /^Filename: /{f=$2}
              p==pkg && f!="" {print f; exit}
            ' /tmp/Packages-${arch} | tr -d '\r\n'
          }

          for arch in arm aarch64; do
            for pkg in proot libtalloc libandroid-shmem; do
              FILENAME=$(get_filename "$pkg" "$arch")
              echo "$pkg ($arch) -> $FILENAME"
              curl -L -o /tmp/${pkg}-${arch}.deb "https://packages-cf.termux.dev/apt/termux-main/${FILENAME}"
              dpkg-deb -x /tmp/${pkg}-${arch}.deb /tmp/${pkg}-${arch}-extract
            done
          done

          cp /tmp/proot-arm-extract/data/data/com.termux/files/usr/bin/proot \
            AndroidTk/app/src/main/jniLibs/armeabi-v7a/libproot.so
          cp /tmp/proot-aarch64-extract/data/data/com.termux/files/usr/bin/proot \
            AndroidTk/app/src/main/jniLibs/arm64-v8a/libproot.so

          find /tmp/libtalloc-arm-extract -name "libtalloc.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/armeabi-v7a/libtalloc.so \;
          find /tmp/libtalloc-aarch64-extract -name "libtalloc.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/arm64-v8a/libtalloc.so \;

          find /tmp/libandroid-shmem-arm-extract -name "libandroid-shmem.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/armeabi-v7a/libandroid-shmem.so \;
          find /tmp/libandroid-shmem-aarch64-extract -name "libandroid-shmem.so*" -exec cp {} AndroidTk/app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so \;

      - name: Fetch curl (both archs) via Maven Central — reliable, fixed URL structure
        run: |
          set -e
          curl -fL -o /tmp/curl.aar \
            "https://repo1.maven.org/maven2/io/github/vvb2060/ndk/curl/8.18.0/curl-8.18.0.aar"

          mkdir -p /tmp/curl-extract
          unzip -o /tmp/curl.aar -d /tmp/curl-extract

          mkdir -p app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/arm64-v8a
          cp /tmp/curl-extract/jni/armeabi-v7a/libcurl.so app/src/main/jniLibs/armeabi-v7a/libcurl.so
          cp /tmp/curl-extract/jni/arm64-v8a/libcurl.so   app/src/main/jniLibs/arm64-v8a/libcurl.so

          chmod +x app/src/main/jniLibs/armeabi-v7a/libcurl.so app/src/main/jniLibs/arm64-v8a/libcurl.so

      - name: Build debug APK
        working-directory: AndroidTk
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidtk-debug
          path: AndroidTk/app/build/outputs/apk/debug/*.apk

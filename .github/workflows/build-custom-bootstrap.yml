name: Build custom-prefix Termux bootstrap (test)

on:
  workflow_dispatch: {}

jobs:
  build-bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, aarch64]
    steps:
      - name: Clone termux-packages
        run: git clone --depth=1 https://github.com/termux/termux-packages.git

      - name: Set our own app package name / prefix
        run: |
          cd termux-packages
          sed -i 's/^TERMUX_APP_PACKAGE=.*/TERMUX_APP_PACKAGE="com.abhiram.androidtk"/' scripts/properties.sh
          grep TERMUX_APP_PACKAGE scripts/properties.sh

      - name: Build bootstrap for ${{ matrix.arch }}
        run: |
          cd termux-packages
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }}

      - name: Upload result (whatever it produces, success or partial)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-bootstrap-${{ matrix.arch }}
          path: termux-packages/bootstrap-*.zip

name: Test proot download only

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the real current proot filename and download it
        run: |
          set -x
          for arch in arm aarch64; do
            echo "=== resolving $arch ==="
            curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-${arch}/Packages.gz" -o /tmp/Packages-${arch}.gz
            gunzip -f /tmp/Packages-${arch}.gz

            FILENAME=$(awk '
              /^Package: /{p=$2}
              /^Filename: /{f=$2}
              /^$/{if(p=="proot"){print f; exit} p=""; f=""}
              END{if(p=="proot") print f}
            ' /tmp/Packages-${arch})

            echo "resolved path: $FILENAME"
            if [ -z "$FILENAME" ]; then
              echo "COULD NOT FIND proot IN THE PACKAGE INDEX FOR $arch"
              exit 1
            fi
            curl -L -o /tmp/proot-${arch}.deb "https://packages-cf.termux.dev/apt/termux-main/${FILENAME}"
            echo "=== size for $arch (should be tens of KB, not ~146 bytes) ==="
            ls -la /tmp/proot-${arch}.deb
          done

      - name: Extract both
        run: |
          dpkg-deb -x /tmp/proot-arm.deb /tmp/proot-arm-extract
          dpkg-deb -x /tmp/proot-aarch64.deb /tmp/proot-aarch64-extract
          ls -la /tmp/proot-arm-extract/data/data/com.termux/files/usr/bin/proot
          ls -la /tmp/proot-aarch64-extract/data/data/com.termux/files/usr/bin/proot
          echo "SUCCESS"

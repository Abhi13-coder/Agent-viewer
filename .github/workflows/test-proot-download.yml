name: Test proot download only

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify
        run: |
          curl -L -o /tmp/proot-arm.deb \
            https://packages-cf.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107-65_arm.deb
          curl -L -o /tmp/proot-aarch64.deb \
            https://packages-cf.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107-65_aarch64.deb

          echo "=== sizes (expect ~78208 and ~84884 bytes) ==="
          ls -la /tmp/proot-arm.deb /tmp/proot-aarch64.deb
          
          echo "=== actual content of the failed download ==="
          cat /tmp/proot-arm.deb

          echo "=== extracting ==="
          dpkg-deb -x /tmp/proot-arm.deb /tmp/proot-arm-extract
          dpkg-deb -x /tmp/proot-aarch64.deb /tmp/proot-aarch64-extract

          echo "=== confirming the actual proot binary exists ==="
          ls -la /tmp/proot-arm-extract/data/data/com.termux/files/usr/bin/proot
          ls -la /tmp/proot-aarch64-extract/data/data/com.termux/files/usr/bin/proot

          echo "SUCCESS — both binaries extracted correctly"
